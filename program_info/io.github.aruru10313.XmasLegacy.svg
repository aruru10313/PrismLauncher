<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- XmasLegacy Snowy Minecraft Style Logo -->
  <defs>
    <!-- Stone gradients for logo body -->
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e5154" />
      <stop offset="100%" stop-color="#2a2c2e" />
    </linearGradient>
    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d0dbe5" />
    </linearGradient>
  </defs>

  <!-- Dark Midnight Background Panel -->
  <rect width="1024" height="1024" rx="180" fill="#0a0d14"/>

  <!-- Star Topper Glow -->
  <circle cx="512" cy="180" r="160" fill="#f5c518" opacity="0.08"/>

  <!-- Logo Group -->
  <g transform="translate(112, 380)">
    <!-- XMAS Text Shadow -->
    <text x="400" y="110" font-family="'Impact', 'Arial Black', sans-serif" font-size="140" font-weight="900" fill="#000000" opacity="0.6" letter-spacing="6" text-anchor="middle">XMAS</text>
    <text x="400" y="240" font-family="'Impact', 'Arial Black', sans-serif" font-size="130" font-weight="900" fill="#000000" opacity="0.6" letter-spacing="6" text-anchor="middle">LEGACY</text>

    <!-- XMAS Text Main Body (Stone Texture) -->
    <text x="396" y="104" font-family="'Impact', 'Arial Black', sans-serif" font-size="140" font-weight="900" fill="url(#stoneGrad)" stroke="#1a1b1c" stroke-width="8" letter-spacing="6" text-anchor="middle">XMAS</text>
    <!-- LEGACY Text Main Body (Stone Texture) -->
    <text x="396" y="234" font-family="'Impact', 'Arial Black', sans-serif" font-size="130" font-weight="900" fill="url(#stoneGrad)" stroke="#1a1b1c" stroke-width="8" letter-spacing="6" text-anchor="middle">LEGACY</text>

    <!-- Snow Caps on Top of Letters (XMAS) -->
    <!-- Soft snowy layers dripping down the text -->
    <path d="M 120,0 Q 150,15 180,0 Q 210,18 240,0 Q 280,20 310,0 Q 350,15 380,0 L 680,0 Q 650,-20 620,-20 Z" fill="url(#snowGrad)" transform="translate(0, -34)" />
    <path d="M 140,120 Q 170,135 200,120 Q 230,140 260,120 Q 300,138 340,120 Q 380,135 410,120 L 660,120 Q 630,100 600,100 Z" fill="url(#snowGrad)" transform="translate(0, -34)" />
  </g>

  <!-- Decorative Christmas Trees at the base -->
  <polygon points="260,820 180,940 340,940" fill="#1b3f27" stroke="#0a0d14" stroke-width="6"/>
  <polygon points="764,820 684,940 844,940" fill="#1b3f27" stroke="#0a0d14" stroke-width="6"/>
  
  <!-- Falling Snowflakes around the logo -->
  <circle cx="200" cy="220" r="10" fill="#ffffff" opacity="0.8"/>
  <circle cx="820" cy="250" r="8" fill="#ffffff" opacity="0.6"/>
  <circle cx="150" cy="500" r="12" fill="#ffffff" opacity="0.9"/>
  <circle cx="880" cy="550" r="7" fill="#ffffff" opacity="0.7"/>
  <circle cx="300" cy="300" r="9" fill="#ffffff" opacity="0.5"/>
  <circle cx="700" cy="280" r="11" fill="#ffffff" opacity="0.85"/>
  <circle cx="512" cy="180" r="18" fill="#f5c518" opacity="0.9"/> <!-- Golden Star -->
</svg>
