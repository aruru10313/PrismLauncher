<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- XmasLegacy Launcher Icon -->
  <!-- Dark navy background -->
  <rect width="1024" height="1024" rx="180" fill="#0d1117"/>
  
  <!-- Christmas star at top -->
  <polygon points="512,60 530,115 588,115 542,148 560,203 512,170 464,203 482,148 436,115 494,115"
           fill="#f5c518" opacity="0.95"/>
  
  <!-- Christmas tree silhouette -->
  <polygon points="512,200 380,500 440,500 360,700 450,700 410,820 614,820 574,700 664,700 584,500 644,500"
           fill="#1a6b3a"/>
  <!-- Tree trunk -->
  <rect x="480" y="820" width="64" height="60" fill="#5a3820"/>
  
  <!-- Snow caps on tree -->
  <polygon points="512,200 380,500 440,500" fill="white" opacity="0.4"/>
  <polygon points="512,200 440,500 584,500" fill="white" opacity="0.2"/>
  
  <!-- Ornaments - Christmas red balls -->
  <circle cx="420" cy="580" r="22" fill="#e85d4a"/>
  <circle cx="604" cy="580" r="22" fill="#e85d4a"/>
  <circle cx="460" cy="660" r="22" fill="#f5c518"/>
  <circle cx="564" cy="660" r="22" fill="#f5c518"/>
  <circle cx="512" cy="550" r="20" fill="#e85d4a" opacity="0.8"/>
  
  <!-- Gold star topper glow -->
  <circle cx="512" cy="130" r="50" fill="#f5c518" opacity="0.15"/>
  
  <!-- Bottom label "XL" monogram -->
  <text x="512" y="940" text-anchor="middle" font-family="Arial Black, sans-serif"
        font-size="80" font-weight="900" fill="#f0f6fc" opacity="0.9" letter-spacing="4">XL</text>
  
  <!-- Subtle red glow at bottom -->
  <ellipse cx="512" cy="900" rx="300" ry="30" fill="#e85d4a" opacity="0.08"/>
</svg>
